name: internal_distribution_app_bff
services:
  keycloak_database:
    container_name: keycloak_database
    image: postgres
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - 5432:5432
    volumes:
      - ./keycloak/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - internal_distribution_app

  keycloak_server:
    container_name: keycloak
    image: keycloak
    depends_on:
      - keycloak_database
    environment:
      - TZ=GMT5
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD}
      - KC_DB=${DATABASE}
      - KC_DB_URL=${DB_URL}
      - KC_DB_USERNAME=${DB_USER}
      - KC_DB_PASSWORD=${DB_PASS}
    build:
      context: ./
      dockerfile: keycloak/Dockerfile
    ports:
      - 8080:8080
    volumes:
      - ./keycloak/mi-realm-realm.json:/opt/keycloak/data/import/mi-realm-realm.json:ro
    networks:
      - internal_distribution_app
    command:
      - start-dev
      - --import-realm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  floci:
    container_name: floci
    image: floci/floci:latest
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_DOCKER_NETWORK: internal_distribution_app
      FLOCI_AUTH_VALIDATE_SIGNATURES: true
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/app/data
    networks:
      - internal_distribution_app

volumes:
  floci-data:
    external: false
    name: floci-data

networks:
  internal_distribution_app:
    name: internal_distribution_app
    external: false